name: Facer deploy do contido de docs + Quartz en florilexio.gal

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # Fetch all history for git info

            - uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Cache Quartz plugins
              uses: actions/cache@v5
              with:
                  path: web/.quartz/plugins
                  key: ${{ runner.os }}-plugins-${{ hashFiles('web/quartz.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-plugins-

            - name: Install Dependencies
              run: npm ci
              working-directory: web

            - name: Install Quartz plugins
              run: npx quartz plugin install
              working-directory: web

            - name: Build Quartz
              run: npx quartz build
              working-directory: web

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: web-public
                  path: web/public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: web-public
                  path: public

            - name: Install sshpass
              run: sudo apt-get update && sudo apt-get install -y sshpass

            - name: Configure known hosts
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_PORT: ${{ secrets.SSH_PORT }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
              run: |
                  set -euo pipefail
                  SSH_DIR="$HOME/.ssh"
                  mkdir -p "$SSH_DIR"
                  chmod 700 "$SSH_DIR"

                  if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
                    printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
                  else
                    if [ -z "${SSH_HOST:-}" ]; then
                      echo "Falta el secreto SSH_HOST" >&2
                      exit 1
                    fi

                    ssh-keyscan -T 10 -p "${SSH_PORT:-22}" -H "$SSH_HOST" > "$SSH_DIR/known_hosts"
                  fi

                  chmod 600 "$SSH_DIR/known_hosts"

            - name: Deploy to server over SSH (rsync)
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_PORT: ${{ secrets.SSH_PORT }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
              run: |
                  set -euo pipefail
                  : "${SSH_HOST:?Falta el secreto SSH_HOST}"
                  : "${SSH_USER:?Falta el secreto SSH_USER}"
                  : "${SSH_PASSWORD:?Falta el secreto SSH_PASSWORD}"

                  SSHPASS="$SSH_PASSWORD" sshpass -e rsync -az --delete \
                    --exclude='cgi-bin' \
                    --exclude='.well-known' \
                    --exclude='.htaccess' \
                    -e "ssh -p ${SSH_PORT:-22} -o PreferredAuthentications=password -o PubkeyAuthentication=no" \
                    public/ \
                    "${SSH_USER}@${SSH_HOST}:/www/"
