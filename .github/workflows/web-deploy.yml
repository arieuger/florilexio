name: Facer deploy do contido de docs + Quartz en florilexio.gal

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # Fetch all history for git info

            - uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Cache Quartz plugins
              uses: actions/cache@v5
              with:
                  path: web/.quartz/plugins
                  key: ${{ runner.os }}-plugins-${{ hashFiles('web/quartz.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-plugins-

            - name: Install Dependencies
              run: npm ci
              working-directory: web

            - name: Install Quartz plugins
              run: npx quartz plugin install
              working-directory: web

            - name: Build Quartz
              run: npx quartz build
              working-directory: web

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: web-public
                  path: web/public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: web-public
                  path: public

            - name: Install sshpass
              run: sudo apt-get update && sudo apt-get install -y sshpass

            - name: Configure known hosts
              run: |
                  mkdir -p ~/.ssh
                  if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
                    echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  else
                    ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
                  fi

            - name: Deploy to server over SSH (rsync)
              run: |
                  sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -az --delete \
                    --exclude='cgi-bin' \
                    --exclude='.well-known' \
                    --exclude='.htaccess' \
                    -e "ssh -p ${{ secrets.SSH_PORT || 22 }} -o PreferredAuthentications=password -o PubkeyAuthentication=no" \
                    public/ \
                    "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/www/"
