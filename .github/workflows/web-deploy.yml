name: Facer deploy do contido de docs + Quartz en florilexio.gal

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # Fetch all history for git info

            - uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Cache dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Cache Quartz plugins
              uses: actions/cache@v5
              with:
                  path: web/.quartz/plugins
                  key: ${{ runner.os }}-plugins-${{ hashFiles('web/quartz.lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-plugins-

            - name: Install Dependencies
              run: npm ci
              working-directory: web

            - name: Install Quartz plugins
              run: npx quartz plugin install
              working-directory: web

            - name: Build Quartz
              run: npx quartz build
              working-directory: web

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: web-public
                  path: web/public

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: web-public
                  path: public

            - name: Deploy to server over SSH
              uses: easingthemes/ssh-deploy@main
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  REMOTE_HOST: ${{ secrets.SSH_HOST }}
                  REMOTE_USER: ${{ secrets.SSH_USER }}
                  REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
                  SOURCE: "public/."
                  TARGET: "/www/"
                  ARGS: "-rlgoDzvc -i --delete --delete-after"
                  EXCLUDE: "cgi-bin,.well-known,.htaccess"
